/* The nexus: the terminal look of RedScope, from the author's Blogger drafts
   ("Technomantic Nexus"), made of tokens and made accessible. Opt-in classes
   (rs-*), usable with zone.css or alone. Motion stops for visitors who ask for
   less of it; text keeps WCAG AA contrast; nothing is loaded from outside. */

/* A skip link for keyboard users: the first thing on the page. */
.rs-skip {
  position: absolute; left: -999rem; top: .5rem; z-index: 200;
  background: var(--rs-accent); color: var(--rs-accent-fg); padding: .5rem 1rem;
}
.rs-skip:focus { left: .5rem; }

/* The frame: a red border around the whole page, the status lines at its
   top and bottom. */
.rs-frame {
  min-height: 100vh; display: flex; flex-direction: column;
  border: 4px solid var(--rs-accent);
}
.rs-status {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: .25rem 1.5rem;
  background: var(--rs-accent); color: var(--rs-accent-fg);
  font: 700 .75rem/1.6 var(--rs-font-mono); letter-spacing: .15em; text-transform: uppercase;
  padding: .2rem 1rem;
}
.rs-status--quiet {
  background: var(--rs-bg); color: var(--rs-accent);
  border-top: 1px solid var(--rs-accent); font-style: italic;
}

/* The workspace: navigation | content | sidebar; one column on narrow screens. */
.rs-nexus { flex: 1; display: grid; grid-template-columns: auto minmax(0, 1fr) 18rem; }
.rs-nexus > main { padding: 2.5rem; min-width: 0; }
@media (max-width: 64rem) {
  .rs-nexus { grid-template-columns: minmax(0, 1fr); }
  .rs-nexus > main { padding: 1.5rem 1rem; }
}

.rs-nav {
  display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
  padding: 2.5rem .75rem; background: var(--rs-surface);
  border-right: 1px solid rgb(var(--rs-accent-rgb) / .25);
}
@media (max-width: 64rem) {
  .rs-nav { flex-direction: row; justify-content: center; padding: .75rem; border-right: 0;
    border-bottom: 1px solid rgb(var(--rs-accent-rgb) / .25); }
}
.rs-nav-hex {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 2.75rem; min-height: 2.75rem; padding: 0 .5rem;
  border: 1px solid var(--rs-accent); color: var(--rs-fg);
  font: .8rem var(--rs-font-mono); text-decoration: none;
  transition: background-color .2s, color .2s, box-shadow .2s;
}
.rs-nav-hex:hover, .rs-nav-hex:focus-visible {
  background: var(--rs-accent); color: var(--rs-accent-fg); text-decoration: none;
  box-shadow: 0 0 15px rgb(var(--rs-accent-rgb) / .6);
}

.rs-sidebar {
  padding: 2rem 1.5rem; background: var(--rs-surface);
  border-left: 1px solid rgb(var(--rs-accent-rgb) / .25);
}
@media (max-width: 64rem) {
  .rs-sidebar { border-left: 0; border-top: 1px solid rgb(var(--rs-accent-rgb) / .25); }
}
.rs-widget-title {
  font: .8rem var(--rs-font-mono); letter-spacing: .2em; text-transform: uppercase;
  color: var(--rs-muted); border-bottom: 1px solid var(--rs-line);
  padding-bottom: .5rem; margin: 0 0 1rem;
}

/* Fragments: posts and records. */
.rs-fragment {
  background: rgb(var(--rs-surface-rgb) / .85); border: 1px solid rgb(var(--rs-accent-rgb) / .2);
  padding: 2rem; margin-bottom: 3rem;
}
.rs-fragment-id {
  display: block; margin-bottom: .75rem;
  font: 700 .8rem var(--rs-font-mono); letter-spacing: .1em; color: var(--rs-accent);
}
.rs-title {
  margin: 0 0 1.5rem; font-size: clamp(1.8rem, 5vw, 3.2rem); line-height: 1;
  font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: -.02em;
  overflow-wrap: anywhere;
}
.rs-title a { color: var(--rs-fg); text-decoration: underline;

.rs-title a:hover { text-decoration-color: var(--rs-accent); }
.rs-content {

}
.rs-content img { max-width: 100%; height: auto; border: 1px solid var(--rs-accent); padding: 4px; background: var(--rs-bg); }

/* Backgrounds and overlays: decoration only, never in the way of reading. */
